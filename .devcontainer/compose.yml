services:
  busy-octopus:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    environment:
      CLAUDE_CONFIG_DIR: /home/node/.claude
      CODEX_HOME: /home/node/.codex
      DISABLE_AUTOUPDATER: "1"
      pnpm_config_store_dir: /workspace/.pnpm-store
    init: true
    pids_limit: 1024
    user: node
    volumes:
      - ..:/workspace:cached
      - type: bind
        source: ${HOME}/.claude
        target: /home/node/.claude
      - type: bind
        source: ${HOME}/.claude.json
        target: /home/node/.claude.json
      - type: bind
        source: ${HOME}/.codex
        target: /home/node/.codex
      - type: bind
        source: ${HOME}/.npmrc
        target: /home/node/.npmrc
        read_only: true
    working_dir: /workspace
